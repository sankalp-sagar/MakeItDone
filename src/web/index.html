<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MakeItDone Agent</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --primary: #60a5fa;
        --success: #34d399;
        --danger: #f87171;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .panel {
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      h1 {
        margin-top: 0;
        margin-bottom: 12px;
        font-size: 24px;
      }

      .chat-history {
        flex: 1;
        overflow-y: auto;
        margin-bottom: 16px;
        padding-right: 8px;
      }

      .chat-history::-webkit-scrollbar {
        width: 6px;
      }

      .chat-history::-webkit-scrollbar-track {
        background: transparent;
      }

      .chat-history::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.1);
        border-radius: 3px;
      }

      .message {
        margin-bottom: 12px;
        padding: 12px;
        border-radius: 8px;
        word-wrap: break-word;
        font-size: 14px;
        line-height: 1.5;
      }

      .message.user {
        background: rgba(96, 165, 250, 0.15);
        border-left: 3px solid var(--primary);
        margin-left: 40px;
      }

      .message.agent {
        background: rgba(52, 211, 153, 0.1);
        border-left: 3px solid var(--success);
        margin-right: 40px;
      }

      .message.error {
        background: rgba(248, 113, 113, 0.1);
        border-left: 3px solid var(--danger);
        margin-right: 40px;
      }

      .message-label {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .input-section {
        border-top: 1px solid rgba(255,255,255,0.08);
        padding-top: 16px;
      }

      .dropzone {
        border: 2px dashed var(--primary);
        border-radius: 12px;
        padding: 24px;
        text-align: center;
        background: rgba(96, 165, 250, 0.06);
        color: var(--text);
        cursor: pointer;
        transition: 0.2s ease;
      }

      .dropzone.dragover {
        background: rgba(96, 165, 250, 0.14);
        transform: scale(1.01);
      }

      .file-input {
        display: none;
      }

      textarea {
        width: 100%;
        min-height: 80px;
        resize: vertical;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.12);
        background: var(--panel-2);
        color: var(--text);
        padding: 12px;
        font: inherit;
        margin-bottom: 12px;
      }

      .toolbar {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        font: inherit;
        cursor: pointer;
        color: #08111f;
        background: var(--success);
        font-weight: bold;
      }

      button.secondary {
        background: #d1d5db;
      }

      .file-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .chip {
        background: var(--panel-2);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 999px;
        padding: 6px 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .status {
        margin-top: 12px;
        color: var(--muted);
        min-height: 24px;
        font-size: 13px;
      }

      .result-box {
        display: none;
        margin-top: 12px;
      }

      .result-box img {
        max-width: 100%;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.08);
      }

      .download-link {
        display: inline-block;
        margin-top: 12px;
        color: var(--primary);
        text-decoration: none;
        font-size: 13px;
      }

      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255,255,255,0.2);
        border-top: 2px solid var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 6px;
        vertical-align: middle;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <h1>MakeItDone Agent</h1>

        <div id="chatHistory" class="chat-history"></div>

        <div class="input-section">
          <div id="fileSection" style="margin-bottom: 12px;">
            <div id="dropzone" class="dropzone" style="margin-bottom: 12px;">
              📎 Drag files here or click to add<br />
              <span style="font-size: 12px; color: var(--muted);">Optional — just type for text tasks</span>
            </div>
            <input id="fileInput" class="file-input" type="file" multiple />
            <div id="fileList" class="file-list"></div>
          </div>

          <textarea id="taskInput" placeholder="What do you want to do? (e.g., make a passport photo, analyze this image, convert to PDF)"></textarea>

          <div style="margin-top: 12px; margin-bottom: 12px; display: none;" id="fileSectionOld">
            <div id="dropzoneOld" class="dropzone" style="margin-bottom: 12px;">
              Drag and drop files here<br />
              or click to choose files
            </div>
            <input id="fileInputOld" class="file-input" type="file" multiple />
            <div id="fileListOld" class="file-list"></div>
          </div>

          <div class="toolbar">
            <button id="runBtn">Run task</button>
            <button id="clearBtn" class="secondary">Clear history</button>
          </div>

          <div id="status" class="status"></div>
        </div>

        <div id="resultBox" class="result-box">
          <img id="resultImage" alt="Generated result" />
          <div><a id="downloadLink" class="download-link" href="#">Download result</a></div>
        </div>
      </div>
    </div>

    <script>
      const dropzone = document.getElementById('dropzone');
      const fileInput = document.getElementById('fileInput');
      const taskInput = document.getElementById('taskInput');
      const fileList = document.getElementById('fileList');
      const statusEl = document.getElementById('status');
      const resultBox = document.getElementById('resultBox');
      const resultImage = document.getElementById('resultImage');
      const downloadLink = document.getElementById('downloadLink');
      const runBtn = document.getElementById('runBtn');
      const clearBtn = document.getElementById('clearBtn');
      const fileSectionEl = document.getElementById('fileSection');
      const chatHistoryEl = document.getElementById('chatHistory');

      const selectedFiles = [];
      const chatHistory = [];

      function renderFiles() {
        fileList.innerHTML = '';
        selectedFiles.forEach((file) => {
          const chip = document.createElement('span');
          chip.className = 'chip';
          chip.textContent = file.name;
          fileList.appendChild(chip);
        });
      }

      function addFiles(list) {
        for (const file of list) {
          const exists = selectedFiles.some((entry) => entry.name === file.name && entry.size === file.size);
          if (!exists) {
            selectedFiles.push(file);
          }
        }
        renderFiles();
      }

      dropzone.addEventListener('click', () => fileInput.click());
      dropzone.addEventListener('dragover', (event) => {
        event.preventDefault();
        dropzone.classList.add('dragover');
      });
      dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
      dropzone.addEventListener('drop', (event) => {
        event.preventDefault();
        dropzone.classList.remove('dragover');
        addFiles(event.dataTransfer.files);
      });
      fileInput.addEventListener('change', (event) => {
        addFiles(event.target.files);
        fileInput.value = '';
      });

      function renderChatHistory() {
        chatHistoryEl.innerHTML = '';
        chatHistory.forEach((msg) => {
          const msgEl = document.createElement('div');
          msgEl.className = `message ${msg.role}`;
          msgEl.innerHTML = `
            <div class="message-label">${msg.role === 'user' ? 'You' : (msg.role === 'agent' ? 'Agent' : 'Error')}</div>
            <div>${escapeHtml(msg.text)}</div>
          `;
          chatHistoryEl.appendChild(msgEl);
        });
        chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function addChatMessage(role, text) {
        chatHistory.push({ role, text });
        renderChatHistory();
      }

      clearBtn.addEventListener('click', () => {
        selectedFiles.length = 0;
        chatHistory.length = 0;
        renderFiles();
        renderChatHistory();
        resultBox.style.display = 'none';
        statusEl.textContent = '';
        taskInput.value = '';
        taskInput.focus();
      });

      function setResultImage(path) {
        if (!path) {
          resultBox.style.display = 'none';
          return;
        }
        resultBox.style.display = 'block';
        resultImage.src = path;
        downloadLink.href = path;
        downloadLink.textContent = 'Download result';
      }

      function formatResultMessage(payload) {
        const task = payload?.task;
        if (!task) {
          return 'Error: No task result returned.';
        }

        if (task.status === 'waiting_for_user') {
          if (task.pendingQuestions && task.pendingQuestions.length > 0) {
            return task.pendingQuestions.join(' ');
          }
          return 'I need more information. Can you be more specific about what you want?';
        }

        const isError = task.status === 'failed';
        let msg = '';

        if (isError) {
          msg += 'Failed to complete task. ';
          if (task.observations && task.observations.length > 0) {
            const lastObs = task.observations[task.observations.length - 1];
            if (lastObs?.message) {
              msg += 'Reason: ' + lastObs.message;
            }
          }
        } else {
          msg += 'Task complete. ';
          if (task.observations && task.observations.length > 0) {
            const steps = task.observations.map((o) => o.message || o.type).filter((s) => s);
            if (steps.length > 0) {
              msg += 'What happened: ' + steps.join(' Then ') + '.';
            }
          }
          if (task.artifacts && task.artifacts.length > 0) {
            const outputs = task.artifacts.filter((a) => a.type === 'image').map((a) => a.name);
            if (outputs.length > 0) {
              msg += ' Generated: ' + outputs.join(', ') + '.';
            }
          }
        }

        return msg;
      }

      runBtn.addEventListener('click', async () => {
        const goal = taskInput.value.trim();
        if (!goal) {
          statusEl.textContent = 'Please enter a task.';
          return;
        }

        addChatMessage('user', goal + (selectedFiles.length > 0 ? ` (with ${selectedFiles.length} file${selectedFiles.length > 1 ? 's' : ''})` : ''));
        taskInput.value = '';
        resultBox.style.display = 'none';
        statusEl.innerHTML = '<span class="spinner"></span>Thinking...';

        const files = await Promise.all(selectedFiles.map(async (file) => {
          const arrayBuffer = await file.arrayBuffer();
          const bytes = new Uint8Array(arrayBuffer);
          let binary = '';
          for (let i = 0; i < bytes.length; i++) {
            binary += String.fromCharCode(bytes[i]);
          }
          return {
            name: file.name,
            type: file.type || 'application/octet-stream',
            contentBase64: btoa(binary),
          };
        }));

        selectedFiles.length = 0;
        renderFiles();

        try {
          const response = await fetch('/api/task', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ goal, files })
          });

          const payload = await response.json();
          statusEl.textContent = '';

          if (!response.ok) {
            addChatMessage('error', payload?.error || 'Request failed.');
            return;
          }

          const resultMsg = formatResultMessage(payload);
          addChatMessage('agent', resultMsg);

          const imagePath = payload?.task?.artifacts?.find((artifact) => artifact.type === 'image')?.path;
          if (imagePath) {
            setResultImage('/files/' + encodeURIComponent(imagePath.split('/').pop() || 'result.jpg'));
          }
        } catch (error) {
          statusEl.textContent = '';
          addChatMessage('error', String(error));
        }
      });

      taskInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && event.ctrlKey) {
          runBtn.click();
        }
      });
    </script>
  </body>
</html>
